<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figure X — Registration Gas per Batch</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 28px;
      font-family: Georgia, "Times New Roman", serif;
      background: #ffffff;
      color: #1a1a1a;
    }
    .box { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 18px; margin: 0 0 8px; text-align: center; }
    p.sub { font-size: 12px; margin: 0 0 14px; color: #444; text-align: center; }
    p.caption { font-size: 11px; margin-top: 14px; color: #333; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Registration Gas per Simulated Batch</h1>
    <p class="sub">Batch size = 10 users (n = 100 total)</p>
    <canvas id="chart" height="340"></canvas>
    <p class="caption"><strong>Figure X:</strong> Gas consumption per registration transaction across simulated users.</p>
  </div>

  <script>
    const labels = ["1-10","11-20","21-30","31-40","41-50","51-60","61-70","71-80","81-90","91-100"];
    const gasAvg = [73165.0,73177.0,73175.8,73175.8,73177.0,73174.6,73175.8,73151.8,73213.0,73277.8];

    new Chart(document.getElementById("chart"), {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "Average gas per registration",
          data: gasAvg,
          backgroundColor: "rgba(13, 110, 253, 0.85)",
          borderColor: "rgba(13, 110, 253, 1)",
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: {
            display: true,
            text: "Large-Scale Registration Simulation: Gas by Batch",
            font: { size: 15 }
          }
        },
        scales: {
          x: {
            title: { display: true, text: "User batch (index range)" }
          },
          y: {
            beginAtZero: false,
            min: 73120,
            max: 73320,
            title: { display: true, text: "Gas used" }
          }
        }
      }
    });
  </script>
</body>
</html>
