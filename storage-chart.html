<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Figure 7 — PCTF Data Distribution</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: Georgia, "Times New Roman", serif;
      background: #ffffff;
      color: #1a1a1a;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      margin: 0 0 8px 0;
    }
    p.sub {
      font-size: 11px;
      color: #444;
      text-align: center;
      margin: 0 0 20px 0;
    }
    .chart-box { background: #ffffff; padding: 8px 0 8px; }
    p.caption {
      font-size: 10.5px;
      color: #333;
      line-height: 1.45;
      margin-top: 18px;
    }
    canvas { max-height: 380px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>PCTF Data Distribution On-Chain vs Off-Chain</h1>
    <p class="sub">122 bytes on-chain metadata vs 4,800 bytes off-chain encrypted (Table 6).</p>
    <div class="chart-box">
      <canvas id="pie" width="520" height="380" aria-label="Pie chart on-chain versus off-chain"></canvas>
    </div>
    <p class="caption"><strong>Figure 7.</strong> PCTF data distribution: on-chain metadata (122 B, 3%) versus off-chain encrypted payload (4,800 B, 97%).</p>
  </div>
  <script>
    const onChain = 122;
    const offChain = 4800;

    const pieSliceLabels = {
      id: "pieSliceLabels",
      afterDraw(chart) {
        const ctx = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        if (!meta.data.length) return;
        const labels = [
          ["3%", "122 B"],
          ["97%", "4,800 B"]
        ];
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        meta.data.forEach((arc, i) => {
          const p = arc.tooltipPosition();
          ctx.font = "600 15px Georgia, serif";
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "rgba(0,0,0,0.25)";
          ctx.lineWidth = 3;
          const [a, b] = labels[i];
          ctx.strokeText(a, p.x, p.y - 8);
          ctx.fillText(a, p.x, p.y - 8);
          ctx.font = "600 12px Georgia, serif";
          ctx.strokeText(b, p.x, p.y + 10);
          ctx.fillText(b, p.x, p.y + 10);
        });
        ctx.restore();
      }
    };

    Chart.register(pieSliceLabels);

    new Chart(document.getElementById("pie"), {
      type: "pie",
      data: {
        labels: [
          "On-Chain Metadata",
          "Off-Chain Encrypted"
        ],
        datasets: [
          {
            data: [onChain, offChain],
            backgroundColor: [
              "rgba(13, 110, 253, 0.92)",
              "rgba(40, 167, 69, 0.92)"
            ],
            borderColor: "#ffffff",
            borderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: {
            position: "bottom",
            labels: {
              boxWidth: 14,
              padding: 14,
              font: { family: "Georgia, serif", size: 12 },
              generateLabels(chart) {
                const data = chart.data;
                if (data.labels.length && data.datasets.length) {
                  return data.labels.map((label, i) => {
                    const ds = data.datasets[0];
                    const pct = i === 0 ? "3%" : "97%";
                    const bytes = i === 0 ? "122" : "4,800";
                    return {
                      text: label + " — " + pct + " (" + bytes + " B)",
                      fillStyle: ds.backgroundColor[i],
                      hidden: false,
                      index: i
                    };
                  });
                }
                return [];
              }
            }
          },
          tooltip: {
            callbacks: {
              label(ctx) {
                const v = ctx.raw;
                const t = onChain + offChain;
                const p = ((v / t) * 100).toFixed(1);
                return " " + v + " bytes (" + p + "%)";
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
